<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>CM大佬群專用記分板</title>

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#45dff5" />
    <meta name="apple-mobile-web-app-title" content="CM記分板" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <style>
        :root {
            --bg-panel: rgba(255, 255, 255, 0.72);
            --text-main: #263245;
            --text-muted: #728098;
            --neon-cyan: #45dff5;
            --neon-pink: #ff7ad9;
            --border-soft: rgba(112, 165, 255, 0.35);
            --shadow-soft: 0 18px 45px rgba(85, 120, 180, 0.18);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 14px;
        }

        /* ==========================================================
   Base
   ========================================================== */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at 10% 8%, rgba(69, 223, 245, 0.26), transparent 28%),
                radial-gradient(circle at 85% 10%, rgba(255, 122, 217, 0.22), transparent 30%),
                linear-gradient(135deg, #f8fcff 0%, #f7f4ff 48%, #eefcff 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(112, 165, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(112, 165, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: -1;
        }

        /* ==========================================================
   Layout
   ========================================================== */
        .page {
            width: min(1480px, calc(100% - 32px));
            margin: 0 auto;
            padding: 34px 0 56px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 18px;
            margin-top: 18px;
        }

        .hero,
        .panel,
        .stat-card {
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-xl);
            background: var(--bg-panel);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
        }

        .filters,
        .chart-panel,
        .table-panel {
            grid-column: span 12;
        }

        /* ==========================================================
   Hero
   ========================================================== */
        .hero {
            padding: 32px;
        }

        .badge {
            display: inline-flex;
            padding: 8px 13px;
            border-radius: 999px;
            color: #287d91;
            background: rgba(236, 254, 255, 0.78);
            font-weight: 900;
            font-size: 13px;
        }

        h1 {
            margin: 18px 0 10px;
            font-size: clamp(30px, 4vw, 52px);
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        .hero p,
        .panel-subtitle,
        .stat-hint,
        .note {
            color: var(--text-muted);
            line-height: 1.7;
        }

        /* ==========================================================
   Form / Buttons
   ========================================================== */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 900;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid rgba(112, 165, 255, 0.32);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.78);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }

        .link-btn {
            border: 0;
            padding: 4px 2px;
            background: none;
            color: #4567a8;
            font: inherit;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .link-btn:hover {
            color: #a34888;
        }

        .filter-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px 16px;
            padding: 0 18px 14px;
        }

        .result-count {
            margin-right: auto;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 900;
        }

        :is(button, a, input, select, tr):focus-visible {
            outline: 3px solid rgba(69, 223, 245, 0.75);
            outline-offset: 2px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            z-index: 1000;
            padding: 11px 18px;
            border-radius: 999px;
            color: #ffffff;
            background: rgba(38, 50, 69, 0.92);
            font-size: 14px;
            font-weight: 900;
            opacity: 0;
            transform: translate(-50%, 12px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1.6fr 1.2fr 1fr 1fr;
            gap: 14px;
            padding: 18px;
        }

        .field label {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* ==========================================================
   Stat Cards
   ========================================================== */
        .cards {
            grid-column: span 12;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .stat-card {
            padding: 20px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 900;
        }

        .stat-value {
            margin-top: 10px;
            font-size: clamp(24px, 3vw, 34px);
            font-weight: 900;
            letter-spacing: -0.05em;
            word-break: break-word;
        }

        /* ==========================================================
   Panel / Chart
   ========================================================== */
        .panel-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 22px 12px;
        }

        .panel-title {
            margin: 0;
            font-size: 18px;
        }

        .chart-panel {
            min-height: 470px;
        }

        .chart-wrap {
            height: 360px;
            padding: 8px 18px 22px;
        }

        .member-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 18px 18px;
        }

        .mini-box {
            padding: 12px;
            border-radius: 16px;
            background: rgba(246, 250, 255, 0.78);
            border: 1px solid rgba(112, 165, 255, 0.24);
        }

        .mini-label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 900;
        }

        .mini-value {
            margin-top: 6px;
            font-size: 17px;
            font-weight: 900;
        }

        /* ==========================================================
   Table
   ========================================================== */
        .table-wrap {
            padding: 0 18px 20px;
            overflow: auto;
            max-height: 560px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            min-width: 900px;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 12px;
            text-align: left;
            color: var(--text-muted);
            background: rgba(247, 251, 255, 0.96);
            font-size: 12px;
        }

        td {
            padding: 14px 12px;
            background: rgba(255, 255, 255, 0.68);
            border-top: 1px solid rgba(112, 165, 255, 0.18);
            border-bottom: 1px solid rgba(112, 165, 255, 0.18);
            font-size: 14px;
            vertical-align: top;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover td {
            background: rgba(247, 252, 255, 0.92);
        }

        tbody tr.is-selected td {
            background: rgba(236, 254, 255, 0.95);
            border-color: rgba(69, 223, 245, 0.55);
        }

        tbody tr.is-selected td:first-child {
            box-shadow: inset 4px 0 0 #45dff5;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        th.sortable:hover {
            color: #4567a8;
        }

        th.sortable::after {
            content: "↕";
            margin-left: 4px;
            opacity: 0.35;
        }

        th.is-sorted {
            color: #4567a8;
        }

        th.is-sorted[data-dir="asc"]::after {
            content: "▲";
            opacity: 1;
        }

        th.is-sorted[data-dir="desc"]::after {
            content: "▼";
            opacity: 1;
        }

        .index-cell {
            font-weight: 900;
            color: #4567a8;
            white-space: nowrap;
        }

        .medal {
            margin-right: 4px;
        }

        .name-cell {
            font-weight: 900;
        }

        .num {
            font-variant-numeric: tabular-nums;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
        }

        /* ==========================================================
   Tags
   ========================================================== */
        .tag {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            background: rgba(112, 165, 255, 0.14);
            color: #4567a8;
            white-space: nowrap;
            margin: 2px;
        }

        .tag.main {
            background: rgba(69, 223, 245, 0.18);
            color: #2f8294;
        }

        .tag.second {
            background: rgba(255, 122, 217, 0.16);
            color: #a34888;
        }

        .tag.third {
            background: rgba(167, 139, 250, 0.18);
            color: #6652b6;
        }

        .tag.fourth {
            background: rgba(255, 200, 87, 0.22);
            color: #956d19;
        }

        .tag.unknown {
            background: rgba(148, 163, 184, 0.18);
            color: #64748b;
        }

        /* ==========================================================
   Floating Button：回到編號 1
   ========================================================== */
        .back-to-first-btn {
            display: none;
        }

        /* ==========================================================
   Tablet
   ========================================================== */
        @media (max-width: 1080px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ==========================================================
   Mobile
   ========================================================== */
        @media (max-width: 720px) {
            body {
                background:
                    radial-gradient(circle at 8% 4%, rgba(69, 223, 245, 0.20), transparent 24%),
                    radial-gradient(circle at 92% 6%, rgba(255, 122, 217, 0.18), transparent 26%),
                    linear-gradient(135deg, #f8fcff 0%, #f7f4ff 48%, #eefcff 100%);
            }

            body::before {
                background-size: 26px 26px;
            }

            .page {
                width: min(100% - 18px, 1480px);
                padding: 14px 0 34px;
            }

            .hero,
            .panel,
            .stat-card {
                border-radius: 18px;
                backdrop-filter: blur(12px);
            }

            .hero {
                padding: 18px;
            }

            .badge {
                padding: 7px 11px;
                font-size: 12px;
            }

            h1 {
                margin: 14px 0 4px;
                font-size: 30px;
                line-height: 1.16;
                letter-spacing: -0.03em;
            }

            .grid {
                gap: 12px;
                margin-top: 12px;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-label {
                font-size: 12px;
            }

            .stat-value {
                margin-top: 7px;
                font-size: 22px;
                letter-spacing: -0.04em;
            }

            .stat-hint {
                margin-top: 4px;
                font-size: 12px;
                line-height: 1.45;
            }

            .filter-row {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 14px;
            }

            input,
            select {
                min-height: 46px;
                padding: 12px 13px;
                font-size: 16px;
                border-radius: 13px;
            }

            .panel-header {
                padding: 16px 16px 10px;
            }

            .panel-title {
                font-size: 17px;
                line-height: 1.35;
            }

            .panel-subtitle {
                margin: 6px 0 0;
                font-size: 13px;
                line-height: 1.55;
            }

            .member-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                padding: 0 14px 12px;
            }

            .mini-box {
                padding: 11px;
                border-radius: 14px;
            }

            .mini-label {
                font-size: 11px;
            }

            .mini-value {
                font-size: 16px;
            }

            .chart-panel {
                min-height: auto;
            }

            .chart-wrap {
                height: 300px;
                padding: 4px 10px 16px;
            }

            /* Mobile table becomes member cards */
            .table-wrap {
                padding: 0 12px 16px;
                overflow: visible;
                max-height: none;
            }

            table {
                min-width: 0;
                width: 100%;
                border-spacing: 0;
            }

            thead {
                display: none;
            }

            tbody {
                display: block;
            }

            tbody tr {
                display: block;
                margin-bottom: 12px;
                padding: 12px;
                border: 1px solid rgba(112, 165, 255, 0.28);
                border-radius: 18px;
                background: rgba(255, 255, 255, 0.74);
                box-shadow: 0 10px 26px rgba(85, 120, 180, 0.12);
                cursor: pointer;
            }

            tbody tr:hover td,
            tbody tr.is-selected td,
            tbody tr.is-selected td:first-child {
                background: transparent;
                box-shadow: none;
            }

            tbody tr.is-selected {
                border-color: rgba(69, 223, 245, 0.8);
                box-shadow: 0 0 0 2px rgba(69, 223, 245, 0.35), 0 10px 26px rgba(85, 120, 180, 0.12);
            }

            .filter-actions {
                padding: 0 14px 12px;
            }

            td {
                display: grid;
                grid-template-columns: 84px 1fr;
                gap: 10px;
                align-items: start;
                padding: 8px 0;
                border: 0;
                background: transparent;
                font-size: 14px;
                line-height: 1.55;
            }

            td::before {
                content: attr(data-label);
                color: var(--text-muted);
                font-size: 12px;
                font-weight: 900;
                white-space: nowrap;
            }

            .index-cell {
                font-size: 16px;
            }

            .tag {
                margin: 1px 3px 3px 0;
                padding: 5px 8px;
                font-size: 12px;
            }

            .note {
                word-break: break-word;
            }

            .empty {
                display: block;
                padding: 24px 12px;
                text-align: center;
            }

            .empty::before {
                content: "";
                display: none;
            }

            .back-to-first-btn {
                position: fixed;
                right: 14px;
                bottom: 18px;
                z-index: 999;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-width: 118px;
                min-height: 44px;
                padding: 11px 14px;
                border: 1px solid rgba(112, 165, 255, 0.42);
                border-radius: 999px;
                color: #244050;
                font-size: 13px;
                font-weight: 900;
                font-family: inherit;
                background:
                    linear-gradient(135deg, rgba(69, 223, 245, 0.86), rgba(255, 122, 217, 0.70)),
                    rgba(255, 255, 255, 0.88);
                box-shadow: 0 12px 28px rgba(85, 120, 180, 0.26);
                backdrop-filter: blur(14px);
                cursor: pointer;
                opacity: 0;
                transform: translateY(12px);
                pointer-events: none;
                transition:
                    opacity 0.22s ease,
                    transform 0.22s ease,
                    box-shadow 0.22s ease;
            }

            .back-to-first-btn.is-visible {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }

            .back-to-first-btn:active {
                transform: translateY(1px) scale(0.98);
                box-shadow: 0 8px 20px rgba(85, 120, 180, 0.22);
            }
        }

        /* ==========================================================
   Small Mobile
   ========================================================== */
        @media (max-width: 420px) {
            .page {
                width: min(100% - 12px, 1480px);
                padding-top: 10px;
            }

            .hero {
                padding: 15px;
            }

            h1 {
                font-size: 27px;
            }

            .cards {
                gap: 8px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-value {
                font-size: 20px;
            }

            .stat-hint {
                font-size: 11px;
            }

            .member-summary {
                grid-template-columns: 1fr 1fr;
            }

            .chart-wrap {
                height: 270px;
            }

            tbody tr {
                padding: 11px;
                border-radius: 16px;
            }

            td {
                grid-template-columns: 76px 1fr;
                gap: 8px;
                font-size: 13px;
            }

            td::before {
                font-size: 11px;
            }

            .back-to-first-btn {
                right: 10px;
                bottom: 14px;
                min-width: 108px;
                min-height: 42px;
                padding: 10px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="hero">
            <div class="badge">TEAM ANALYTICS</div>
            <h1>大佬群成績</h1>
        </section>

        <section class="grid">
            <div class="cards">
                <article class="stat-card">
                    <div class="stat-label">成員數</div>
                    <div id="statMembers" class="stat-value">0</div>
                    <div class="stat-hint">目前篩選下的不重複成員</div>
                </article>

                <article class="stat-card">
                    <div class="stat-label">總累積分數</div>
                    <div id="statTotalScore" class="stat-value">0</div>
                    <div class="stat-hint">目前篩選資料加總</div>
                </article>

                <article class="stat-card">
                    <div class="stat-label">最高個人總分</div>
                    <div id="statTopMember" class="stat-value">-</div>
                    <div id="statTopMemberHint" class="stat-hint">尚無資料</div>
                </article>

                <article class="stat-card">
                    <div class="stat-label">資料時段</div>
                    <div id="statPeriods" class="stat-value">0</div>
                    <div class="stat-hint">目前篩選下的時段數</div>
                </article>
            </div>

            <section class="panel filters">
                <div class="filter-row">
                    <div class="field">
                        <label for="searchInput">搜尋成員</label>
                        <input id="searchInput" type="search" placeholder="輸入名稱、備註、隊伍或時段" autocomplete="off" />
                    </div>

                    <div class="field">
                        <label for="periodFilter">時段篩選</label>
                        <select id="periodFilter">
                            <option value="all">全部時段</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="teamFilter">隊伍篩選</label>
                        <select id="teamFilter">
                            <option value="all">全部隊伍</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="memberSelect">個人走勢圖</label>
                        <select id="memberSelect">
                            <option value="">選擇成員</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <span id="resultCount" class="result-count"></span>
                    <button id="clearFiltersBtn" class="link-btn" type="button" hidden>清除篩選</button>
                    <button id="copyLinkBtn" class="link-btn" type="button">複製目前畫面連結</button>
                </div>
            </section>

            <section id="chartPanel" class="panel chart-panel">
                <div class="panel-header">
                    <div>
                        <h2 id="chartTitle" class="panel-title">個人分數走勢</h2>
                        <p id="chartSubtitle" class="panel-subtitle">點選表格中的成員，即可查看分數變化。</p>
                    </div>
                </div>

                <div class="member-summary">
                    <div class="mini-box">
                        <div class="mini-label">個人總分</div>
                        <div id="memberTotal" class="mini-value">-</div>
                    </div>

                    <div class="mini-box">
                        <div class="mini-label">平均分</div>
                        <div id="memberAvg" class="mini-value">-</div>
                    </div>

                    <div class="mini-box">
                        <div class="mini-label">最高單期</div>
                        <div id="memberMax" class="mini-value">-</div>
                    </div>

                    <div class="mini-box">
                        <div class="mini-label">參與筆數</div>
                        <div id="memberCount" class="mini-value">-</div>
                    </div>
                </div>

                <div class="chart-wrap">
                    <canvas id="trendChart"></canvas>
                </div>
            </section>

            <section class="panel table-panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">每位成員詳細數據</h2>
                        <p class="panel-subtitle">依目前篩選條件計算。點選欄位標題可排序，點選任一列可切換個人走勢圖。</p>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr id="tableHeadRow">
                                <th data-sort="rank" class="sortable">排名</th>
                                <th data-sort="name" class="sortable">成員</th>
                                <th>隊伍</th>
                                <th data-sort="total" class="sortable">總分</th>
                                <th data-sort="avg" class="sortable">平均分</th>
                                <th data-sort="max" class="sortable">最高單期</th>
                                <th data-sort="min" class="sortable">最低單期</th>
                                <th data-sort="count" class="sortable">參與筆數</th>
                                <th>備註</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        /************************************************************
         * 1. 資料檔（存在 repo 的 data/，GitHub Actions 每天執行 scripts/fetch_sheets.py 更新）
         ************************************************************/
        const DATA_URL = "./data/scores.json";

        const TEAM_ORDER = ["主隊", "二隊", "三隊", "四隊", "未標註"];
        const TEAM_CLASS = { 主隊: "main", 二隊: "second", 三隊: "third", 四隊: "fourth", 未標註: "unknown" };
        const MEDALS = ["🥇", "🥈", "🥉"];

        /************************************************************
         * 2. 全域狀態
         ************************************************************/
        let periods = [];
        let periodByKey = new Map();
        let rawRows = [];
        let selectedMember = "";
        let sortState = { key: "rank", dir: "asc" };
        let trendChart = null;
        let isLoading = true;
        let loadError = "";
        let urlStateApplied = false;

        const els = {
            searchInput: document.getElementById("searchInput"),
            teamFilter: document.getElementById("teamFilter"),
            periodFilter: document.getElementById("periodFilter"),
            memberSelect: document.getElementById("memberSelect"),
            resultCount: document.getElementById("resultCount"),
            clearFiltersBtn: document.getElementById("clearFiltersBtn"),
            copyLinkBtn: document.getElementById("copyLinkBtn"),

            statMembers: document.getElementById("statMembers"),
            statTotalScore: document.getElementById("statTotalScore"),
            statTopMember: document.getElementById("statTopMember"),
            statTopMemberHint: document.getElementById("statTopMemberHint"),
            statPeriods: document.getElementById("statPeriods"),

            chartPanel: document.getElementById("chartPanel"),
            chartTitle: document.getElementById("chartTitle"),
            chartSubtitle: document.getElementById("chartSubtitle"),
            memberTotal: document.getElementById("memberTotal"),
            memberAvg: document.getElementById("memberAvg"),
            memberMax: document.getElementById("memberMax"),
            memberCount: document.getElementById("memberCount"),

            tableHeadRow: document.getElementById("tableHeadRow"),
            memberTableBody: document.getElementById("memberTableBody"),
            toast: document.getElementById("toast")
        };

        /************************************************************
         * 3. 基本工具函式
         ************************************************************/
        function normalizeText(value) {
            return String(value ?? "").trim();
        }

        function formatNumber(num) {
            if (!Number.isFinite(num)) return "0";
            return Math.round(num).toLocaleString("zh-TW");
        }

        function unique(arr) {
            return [...new Set(arr.filter(Boolean))];
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function compactText(arr, joiner = "、") {
            const cleaned = unique(arr.map(v => normalizeText(v)));
            return cleaned.length ? cleaned.join(joiner) : "-";
        }

        function teamTag(team) {
            return `<span class="tag ${TEAM_CLASS[team] || ""}">${escapeHtml(team)}</span>`;
        }

        function debounce(fn, wait) {
            let timer = null;

            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), wait);
            };
        }

        function showToast(message) {
            els.toast.textContent = message;
            els.toast.classList.add("is-visible");

            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => els.toast.classList.remove("is-visible"), 1800);
        }

        /************************************************************
         * 4. 讀取資料
         ************************************************************/
        async function loadData() {
            try {
                const response = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });

                if (!response.ok) {
                    throw new Error(`讀取資料檔失敗，HTTP ${response.status}`);
                }

                const data = await response.json();

                periods = Array.isArray(data.periods) ? data.periods : [];
                periodByKey = new Map(periods.map((p, index) => [p.key, { ...p, order: index }]));

                rawRows = (Array.isArray(data.records) ? data.records : [])
                    .filter(r => periodByKey.has(r.period))
                    .map(r => ({
                        period: r.period,
                        periodLabel: periodByKey.get(r.period).label,
                        name: normalizeText(r.name),
                        team: normalizeText(r.team) || "未標註",
                        score: Number(r.score) || 0,
                        note: normalizeText(r.note)
                    }));

                renderFilterOptions();

                if (!urlStateApplied) {
                    applyUrlState();
                    urlStateApplied = true;
                }

            } catch (error) {
                console.error(error);
                loadError = `資料讀取失敗：${error.message}`;
            } finally {
                isLoading = false;
                refreshAll();
            }
        }

        /************************************************************
         * 5. 網址參數（方便把目前畫面分享到群組）
         ************************************************************/
        function applyUrlState() {
            const params = new URLSearchParams(location.search);

            els.searchInput.value = params.get("q") || "";

            const setIfExists = (select, value) => {
                if (value && [...select.options].some(o => o.value === value)) {
                    select.value = value;
                }
            };

            setIfExists(els.teamFilter, params.get("team"));
            setIfExists(els.periodFilter, params.get("period"));

            selectedMember = params.get("member") || "";

            const [sortKey, sortDir] = (params.get("sort") || "").split(":");

            if (els.tableHeadRow.querySelector(`[data-sort="${CSS.escape(sortKey || "")}"]`)) {
                sortState = { key: sortKey, dir: sortDir === "desc" ? "desc" : "asc" };
            }
        }

        function syncUrl(defaultMember) {
            const params = new URLSearchParams();
            const keyword = normalizeText(els.searchInput.value);

            if (keyword) params.set("q", keyword);
            if (els.periodFilter.value !== "all") params.set("period", els.periodFilter.value);
            if (els.teamFilter.value !== "all") params.set("team", els.teamFilter.value);
            if (selectedMember && selectedMember !== defaultMember) params.set("member", selectedMember);
            if (sortState.key !== "rank") params.set("sort", `${sortState.key}:${sortState.dir}`);

            const qs = params.toString();
            history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
        }

        /************************************************************
         * 6. 資料彙整
         ************************************************************/
        function getFilteredRows({ ignoreKeyword = false } = {}) {
            const keyword = ignoreKeyword ? "" : normalizeText(els.searchInput.value).toLowerCase();
            const team = els.teamFilter.value;
            const period = els.periodFilter.value;

            return rawRows.filter(row => {
                if (team !== "all" && row.team !== team) return false;
                if (period !== "all" && row.period !== period) return false;
                if (!keyword) return true;

                return `${row.name} ${row.team} ${row.note} ${row.periodLabel}`.toLowerCase().includes(keyword);
            });
        }

        function periodOrder(key) {
            return periodByKey.get(key)?.order ?? 0;
        }

        function aggregateMembers(rows) {
            const map = new Map();

            rows.forEach(row => {
                if (!map.has(row.name)) {
                    map.set(row.name, {
                        name: row.name,
                        teams: [],
                        notes: [],
                        total: 0,
                        max: 0,
                        min: Infinity,
                        count: 0
                    });
                }

                const item = map.get(row.name);

                item.teams.push(row.team);
                item.notes.push(row.note);
                item.total += row.score;
                item.max = Math.max(item.max, row.score);
                item.min = Math.min(item.min, row.score);
                item.count += 1;
            });

            return [...map.values()]
                .sort((a, b) => b.total - a.total)
                .map((item, index) => ({
                    ...item,
                    rank: index + 1,
                    avg: item.count ? item.total / item.count : 0,
                    min: item.min === Infinity ? 0 : item.min,
                    teams: TEAM_ORDER.filter(t => item.teams.includes(t))
                        .concat(unique(item.teams).filter(t => !TEAM_ORDER.includes(t))),
                    notesText: compactText(item.notes, "；")
                }));
        }

        function sortMembers(members) {
            const { key, dir } = sortState;
            const sign = dir === "asc" ? 1 : -1;

            return [...members].sort((a, b) => {
                const diff = key === "name"
                    ? a.name.localeCompare(b.name, "zh-Hant")
                    : a[key] - b[key];

                return diff * sign || a.rank - b.rank;
            });
        }

        function getAllTeams() {
            const existing = unique(rawRows.map(r => r.team));

            return [
                ...TEAM_ORDER.filter(team => existing.includes(team)),
                ...existing.filter(team => !TEAM_ORDER.includes(team)).sort((a, b) => a.localeCompare(b, "zh-Hant"))
            ];
        }

        function getTrend(memberName) {
            // 比較基準：同樣的隊伍 / 時段篩選，但不受搜尋字影響
            const baseRows = getFilteredRows({ ignoreKeyword: true });
            const keys = unique(baseRows.filter(r => r.name === memberName).map(r => r.period))
                .sort((a, b) => periodOrder(a) - periodOrder(b));

            const sumBy = (list, key) => list.filter(r => r.period === key).reduce((s, r) => s + r.score, 0);

            return {
                labels: keys.map(key => periodByKey.get(key)?.label || key),
                scores: keys.map(key => sumBy(baseRows.filter(r => r.name === memberName), key)),
                averages: keys.map(key => {
                    const inPeriod = baseRows.filter(r => r.period === key);
                    const people = unique(inPeriod.map(r => r.name)).length;
                    return people ? sumBy(inPeriod, key) / people : 0;
                })
            };
        }

        /************************************************************
         * 7. 畫面更新
         ************************************************************/
        function fillSelect(select, options, placeholder) {
            const old = select.value;

            select.innerHTML = "";
            select.appendChild(new Option(placeholder.label, placeholder.value));
            options.forEach(o => select.appendChild(new Option(o.label, o.value)));

            select.value = options.some(o => o.value === old) ? old : placeholder.value;
        }

        function renderFilterOptions() {
            // 最新的時段排在最前面
            fillSelect(
                els.periodFilter,
                [...periods].reverse().map(p => ({ value: p.key, label: p.label })),
                { value: "all", label: "全部時段" }
            );

            fillSelect(
                els.teamFilter,
                getAllTeams().map(team => ({ value: team, label: team })),
                { value: "all", label: "全部隊伍" }
            );
        }

        function renderMemberOptions(members) {
            fillSelect(
                els.memberSelect,
                [...members]
                    .sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"))
                    .map(m => ({ value: m.name, label: m.name })),
                { value: "", label: "選擇成員" }
            );

            els.memberSelect.value = selectedMember;
        }

        function renderStats(members, rows) {
            const totalScore = rows.reduce((sum, row) => sum + row.score, 0);
            const top = members[0];

            els.statMembers.textContent = formatNumber(members.length);
            els.statTotalScore.textContent = formatNumber(totalScore);
            els.statPeriods.textContent = formatNumber(unique(rows.map(r => r.period)).length);

            els.statTopMember.textContent = top ? top.name : "-";
            els.statTopMemberHint.textContent = top ? `${formatNumber(top.total)} 分` : "尚無資料";
        }

        function hasActiveFilters() {
            return Boolean(
                normalizeText(els.searchInput.value) ||
                els.periodFilter.value !== "all" ||
                els.teamFilter.value !== "all"
            );
        }

        function renderFilterActions(members) {
            els.clearFiltersBtn.hidden = !hasActiveFilters();
            els.resultCount.textContent = rawRows.length ? `顯示 ${formatNumber(members.length)} 位成員` : "";
        }

        function renderSortIndicators() {
            els.tableHeadRow.querySelectorAll("th[data-sort]").forEach(th => {
                const active = th.dataset.sort === sortState.key;

                th.classList.toggle("is-sorted", active);
                th.dataset.dir = active ? sortState.dir : "";
                th.setAttribute("aria-sort", active ? (sortState.dir === "asc" ? "ascending" : "descending") : "none");
            });
        }

        function renderTable(members) {
            renderSortIndicators();

            if (!members.length) {
                els.memberTableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty">
                            ${rawRows.length
                                ? `找不到符合條件的成員。<br><button type="button" class="link-btn" data-action="clear-filters">清除篩選</button>`
                                : escapeHtml(loadError || (isLoading ? "資料讀取中..." : "目前沒有資料。"))}
                        </td>
                    </tr>
                `;
                return;
            }

            els.memberTableBody.innerHTML = sortMembers(members).map(member => `
                <tr data-member="${escapeHtml(member.name)}" tabindex="0"
                    class="${member.name === selectedMember ? "is-selected" : ""}"
                    aria-selected="${member.name === selectedMember}">
                    <td data-label="排名" class="index-cell">
                        <span>${member.rank <= 3 ? `<span class="medal" aria-hidden="true">${MEDALS[member.rank - 1]}</span>` : ""}${member.rank}</span>
                    </td>
                    <td data-label="成員" class="name-cell">${escapeHtml(member.name)}</td>
                    <td data-label="隊伍"><span>${member.teams.map(teamTag).join(" ") || "-"}</span></td>
                    <td data-label="總分" class="num">${formatNumber(member.total)}</td>
                    <td data-label="平均分" class="num">${formatNumber(member.avg)}</td>
                    <td data-label="最高單期" class="num">${formatNumber(member.max)}</td>
                    <td data-label="最低單期" class="num">${formatNumber(member.min)}</td>
                    <td data-label="參與筆數" class="num">${formatNumber(member.count)}</td>
                    <td data-label="備註" class="note">${escapeHtml(member.notesText)}</td>
                </tr>
            `).join("");
        }

        function renderTrendChart(rows, members) {
            const member = members.find(m => m.name === selectedMember);

            if (trendChart) {
                trendChart.destroy();
                trendChart = null;
            }

            if (!member) {
                els.chartTitle.textContent = "個人分數走勢";
                els.chartSubtitle.textContent = "尚無可顯示的成員資料。";
                els.memberTotal.textContent = "-";
                els.memberAvg.textContent = "-";
                els.memberMax.textContent = "-";
                els.memberCount.textContent = "-";
                return;
            }

            const trend = getTrend(member.name);
            const useLine = els.periodFilter.value === "all" && trend.labels.length > 1;
            const avgLabel = els.teamFilter.value === "all" ? "全體平均" : `${els.teamFilter.value}平均`;

            els.chartTitle.textContent = `${member.name}｜第 ${member.rank} 名・${useLine ? "個人分數走勢" : "本時段分數"}`;
            els.chartSubtitle.textContent =
                `隊伍：${member.teams.join("、") || "-"}　備註：${member.notesText}　虛線 / 灰色為${avgLabel}，方便比較。`;

            els.memberTotal.textContent = formatNumber(member.total);
            els.memberAvg.textContent = formatNumber(member.avg);
            els.memberMax.textContent = formatNumber(member.max);
            els.memberCount.textContent = formatNumber(member.count);

            const ctx = document.getElementById("trendChart").getContext("2d");

            const gradient = ctx.createLinearGradient(0, 0, 0, 360);
            gradient.addColorStop(0, "rgba(69, 223, 245, 0.35)");
            gradient.addColorStop(0.55, "rgba(255, 122, 217, 0.14)");
            gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

            const barGradient = ctx.createLinearGradient(0, 0, 0, 360);
            barGradient.addColorStop(0, "rgba(69, 223, 245, 0.72)");
            barGradient.addColorStop(0.55, "rgba(255, 122, 217, 0.42)");
            barGradient.addColorStop(1, "rgba(167, 139, 250, 0.28)");

            const memberDataset = useLine
                ? {
                    label: `${member.name} 分數`,
                    data: trend.scores,
                    borderColor: "#45dff5",
                    backgroundColor: gradient,
                    pointBackgroundColor: "#ff7ad9",
                    pointBorderColor: "#ffffff",
                    pointBorderWidth: 3,
                    pointRadius: 6,
                    borderWidth: 4,
                    fill: true,
                    tension: 0.35
                }
                : {
                    label: `${member.name} 分數`,
                    data: trend.scores,
                    backgroundColor: barGradient,
                    borderColor: "rgba(69, 223, 245, 0.85)",
                    borderWidth: 2,
                    borderRadius: 16,
                    borderSkipped: false,
                    maxBarThickness: 96
                };

            const averageDataset = useLine
                ? {
                    label: avgLabel,
                    data: trend.averages,
                    borderColor: "rgba(114, 128, 152, 0.7)",
                    borderDash: [6, 6],
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.35
                }
                : {
                    label: avgLabel,
                    data: trend.averages,
                    backgroundColor: "rgba(148, 163, 184, 0.28)",
                    borderColor: "rgba(114, 128, 152, 0.5)",
                    borderWidth: 2,
                    borderRadius: 16,
                    borderSkipped: false,
                    maxBarThickness: 96
                };

            const allValues = [...trend.scores, ...trend.averages];

            trendChart = new Chart(ctx, {
                type: useLine ? "line" : "bar",
                data: {
                    labels: trend.labels,
                    datasets: [memberDataset, averageDataset]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: "index"
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: "#42526b",
                                font: { weight: "bold" }
                            }
                        },
                        tooltip: {
                            backgroundColor: "rgba(255,255,255,0.94)",
                            titleColor: "#263245",
                            bodyColor: "#263245",
                            borderColor: "rgba(69,223,245,0.55)",
                            borderWidth: 1,
                            padding: 12,
                            callbacks: {
                                label: context => `${context.dataset.label}：${formatNumber(context.parsed.y)}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: "#728098",
                                font: { weight: "bold" },
                                maxRotation: useLine ? 35 : 0,
                                minRotation: 0
                            },
                            grid: {
                                display: useLine,
                                color: "rgba(112, 165, 255, 0.16)"
                            }
                        },
                        y: {
                            beginAtZero: true,
                            suggestedMax: allValues.length ? Math.max(...allValues) * 1.18 : undefined,
                            ticks: {
                                color: "#728098",
                                callback: value => formatNumber(value)
                            },
                            grid: {
                                color: "rgba(112, 165, 255, 0.16)"
                            }
                        }
                    }
                }
            });
        }

        function refreshAll() {
            const rows = getFilteredRows();
            const members = aggregateMembers(rows);

            if (!members.some(m => m.name === selectedMember)) {
                selectedMember = members[0]?.name || "";
            }

            renderMemberOptions(members);
            renderStats(members, rows);
            renderFilterActions(members);
            renderTable(members);
            renderTrendChart(rows, members);

            if (urlStateApplied) syncUrl(members[0]?.name);

            updateBackToFirstButtonVisibility();
        }

        function selectMember(memberName, { scroll = false } = {}) {
            if (!memberName) return;

            selectedMember = memberName;
            refreshAll();

            if (scroll && els.chartPanel.getBoundingClientRect().top < 0) {
                els.chartPanel.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        function clearFilters() {
            els.searchInput.value = "";
            els.periodFilter.value = "all";
            els.teamFilter.value = "all";
            refreshAll();
        }

        /************************************************************
         * 8. 手機版：回到排名 1 按鈕
         ************************************************************/
        function createBackToFirstButton() {
            if (document.getElementById("backToFirstBtn")) return;

            const button = document.createElement("button");

            button.id = "backToFirstBtn";
            button.className = "back-to-first-btn";
            button.type = "button";
            button.textContent = "回到列表頂端";
            button.setAttribute("aria-label", "回到目前列表的第一位");

            button.addEventListener("click", () => {
                const target = els.memberTableBody.querySelector("tr[data-member]") || document.querySelector(".table-panel");
                target?.scrollIntoView({ behavior: "smooth", block: "start" });
            });

            document.body.appendChild(button);
        }

        function updateBackToFirstButtonVisibility() {
            const button = document.getElementById("backToFirstBtn");

            if (!button) return;

            const isMobile = window.matchMedia("(max-width: 720px)").matches;
            const tablePanel = document.querySelector(".table-panel");
            const firstRow = els.memberTableBody.querySelector("tr[data-member]");

            if (!isMobile || !tablePanel || !firstRow) {
                button.classList.remove("is-visible");
                return;
            }

            const hasEnteredTableArea = tablePanel.getBoundingClientRect().top < window.innerHeight * 0.45;
            const hasScrolledPastFirstRow = firstRow.getBoundingClientRect().top < -80;

            button.classList.toggle("is-visible", hasEnteredTableArea && hasScrolledPastFirstRow);
        }

        /************************************************************
         * 9. 事件
         ************************************************************/
        window.addEventListener("scroll", updateBackToFirstButtonVisibility, { passive: true });
        window.addEventListener("resize", updateBackToFirstButtonVisibility);


        els.searchInput.addEventListener("input", debounce(refreshAll, 180));
        els.teamFilter.addEventListener("change", refreshAll);
        els.periodFilter.addEventListener("change", refreshAll);
        els.memberSelect.addEventListener("change", event => selectMember(event.target.value));
        els.clearFiltersBtn.addEventListener("click", clearFilters);

        els.copyLinkBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(location.href);
                showToast("已複製連結，可直接貼到群組");
            } catch {
                showToast("無法自動複製，請直接複製網址列");
            }
        });

        els.tableHeadRow.addEventListener("click", event => {
            const th = event.target.closest("th[data-sort]");
            if (!th) return;

            const key = th.dataset.sort;
            const defaultDir = key === "rank" || key === "name" ? "asc" : "desc";

            sortState = sortState.key === key
                ? { key, dir: sortState.dir === "asc" ? "desc" : "asc" }
                : { key, dir: defaultDir };

            refreshAll();
        });

        els.memberTableBody.addEventListener("click", event => {
            if (event.target.closest("[data-action='clear-filters']")) {
                clearFilters();
                return;
            }

            const tr = event.target.closest("tr[data-member]");
            if (tr) selectMember(tr.dataset.member, { scroll: true });
        });

        els.memberTableBody.addEventListener("keydown", event => {
            const tr = event.target.closest("tr[data-member]");
            if (!tr || (event.key !== "Enter" && event.key !== " ")) return;

            event.preventDefault();
            selectMember(tr.dataset.member, { scroll: true });

            // 表格重繪後把焦點放回同一列，方便繼續用鍵盤操作
            [...els.memberTableBody.querySelectorAll("tr[data-member]")]
                .find(row => row.dataset.member === selectedMember)
                ?.focus({ preventScroll: true });
        });

        /************************************************************
         * 10. 初始化
         ************************************************************/
        createBackToFirstButton();
        refreshAll();
        loadData();
    </script>
</body>

</html>
